apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-service
  labels:
    app: web-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-service
  template:
    metadata:
      labels:
        app: web-service
    spec:
      containers:
      - name: web-service
        image: python:3.11-slim
        command: ["python3", "-m", "http.server", "8080"]
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: redis-secret

---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  labels:
    app: web-service
spec:
  type: ClusterIP
  selector:
    app: web-service
  ports:
  - port: 80
    targetPort: 8080
